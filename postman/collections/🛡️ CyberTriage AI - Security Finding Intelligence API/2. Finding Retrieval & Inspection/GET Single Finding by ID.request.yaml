$kind: http-request
url: "{{baseUrl}}/api/findings/{{finding_id}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK", () => pm.response.to.have.status(200));
      const item = pm.response.json();
      pm.test("Finding ID matches requested ID", () => {
          pm.expect(item.finding.id).to.equal(pm.environment.get("finding_id"));
      });
    language: text/javascript
order: 2000
